name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Cabinet Saz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f CabinetSaz.zip || { echo "CabinetSaz.zip was not found in the repository root."; exit 1; }
          mkdir -p android-project
          unzip -q CabinetSaz.zip -d android-project

          settings_file="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$settings_file" ]; then
            echo "No settings.gradle or settings.gradle.kts was found inside CabinetSaz.zip."
            echo "The archive must contain the Android Gradle project."
            exit 1
          fi

          project_dir="$(cd "$(dirname "$settings_file")" && pwd)"
          echo "ANDROID_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Android Gradle project at: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle configuration
        run: cd "$ANDROID_PROJECT_DIR" && gradle --no-daemon tasks

      - name: Run unit tests
        run: cd "$ANDROID_PROJECT_DIR" && gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: cd "$ANDROID_PROJECT_DIR" && gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CabinetSaz-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
